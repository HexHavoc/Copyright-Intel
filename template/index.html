<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CopyrightIntel | Audio Rights & Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="bg-glow" aria-hidden="true"></div>
<div class="bg-grid" aria-hidden="true"></div>

<div class="page landing-page">
  <header class="header">
    <div class="brand-row">
      <div class="logo-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </div>
      <span class="brand-label">Copyright-Intel</span>
    </div>
    <h1 class="headline">Know before<br>you upload.</h1>
    <p class="subhead">
      Audit audio licensing, verify track copyright claims, inspect release metadata, and discover safe alternatives.
    </p>
  </header>

  <div class="input-bar">
    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="urlInput" type="text" placeholder="https://www.youtube.com/watch?v=..." class="url-input" spellcheck="false" autocomplete="off" />
    <button id="checkBtn" class="check-btn">
      <span>Analyze Track</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </div>
  <div id="errorMsg" class="error-msg hidden"></div>

  <div id="waveformWrap" class="waveform state-idle" aria-hidden="true"></div>

  <footer class="footer">
    <div class="footer-status">
      <span class="pulse-dot"></span>
      <span class="footer-text">YouTube Data API v3 Connected</span>
    </div>
    <span class="footer-text">Automated indicators · Not formal legal counsel</span>
  </footer>
</div>

<script src="script.js"></script>
</body>
</html>
